# Rune color presets: name=bodyHex,glowHex,emissiveBoost
# bodyHex = base rune fill color, glowHex = rim/highlight accent color
# emissiveBoost = multiplier applied to the body color for the glow fill (1.0 = no boost).
# Values above 1.0 push the fill into HDR range, which triggers bloom for a brighter/glowing look.

